scopes:
  source:
    files:
      dm_victim:
        include:
          - vm3-dmgen/base/**/*
          - vm3-dmgen/victim/**/*

conflict_resolvers:
  - paths:
      - pnpm-lock.yaml
    strategy: pnpm
  - paths:
      - vm3-json-reorder-policy.json
    strategy: json

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
queue_rules:
  - name: vm3-dmgen-261007
    queue_conditions:
      - base = vm3-dmgen-base-261007
      - title ~= ^VM3 DMGEN 261007
    merge_conditions: []
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: vm3-sir3-260923
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-pw-backslash-gate-260929
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge

  - name: vm3-freeze-batch-260925
    queue_conditions: []
    merge_conditions: []
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge
  - name: vm3-pending-authz-261006
    queue_conditions:
      - base = vm3-pending-authz-target-261006
      - files = ready.txt
    merge_conditions: []
    batch_size: 1
    merge_method: merge

  - name: vm3-pnpm-same-dep-261006
    queue_conditions:
      - base = vm3-pnpm-base-261006
    merge_conditions: []
    batch_size: 1
    merge_method: fast-forward

  - name: vm3-jsonreorder-forcedbatch-261007
    queue_conditions:
      - base = vm3-jsonreorder-base-261007
      - title = VM3 JSON REORDER FORCED 261007
    merge_conditions:
      - check-success = vm3-jsonreorder-never-261007
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch

merge_queue:
  skip_intermediate_results: true
  mode: serial
  max_parallel_checks: 2
pull_request_rules:
  - name: vm3 skip-intermediate attacker-code fixture
    conditions:
      - base = vm3-sir3-target-260923
      - title ~= ^VM3 SIR3 260923
    actions:
      queue:
        name: vm3-sir3-260923
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

  - name: vm3 scheduled-freeze exclusion batch 260925
    conditions:
      - base = vm3-freeze-batch-target-260925
      - title ~= ^VM3 FREEZE BATCH 260925
    actions:
      queue:
        name: vm3-freeze-batch-260925

  - name: vm3 CircleCI quarantine impact 261004
    conditions:
      - base = main
      - title = VM3 CIRCLECI QUARANTINE IMPACT 261004
      - author = livastic-vm5-secondary-20260911
      - check-success = vm3-circleci-quarantine-impact-261004
    actions:
      merge:
        method: squash

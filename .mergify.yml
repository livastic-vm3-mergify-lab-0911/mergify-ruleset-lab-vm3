scopes:
  source:
    files:
      alpha:
        include:
          - 'alpha/**'
      beta:
        include:
          - 'beta/**'
  barrier_files:
    include:
      - 'global/**'

queue_rules:
  - name: vm3-direct-barrier-v2-260926
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge

merge_queue:
  mode: serial
  max_parallel_checks: 1

pull_request_rules:
  - name: vm3 direct barrier seed v2
    conditions:
      - base = vm3-direct-barrier-base-v2-260926
      - title = VM3 DIRECT BARRIER SEED V2 260926
    actions:
      queue:
        name: vm3-direct-barrier-v2-260926
  - name: vm3 direct barrier candidate v2
    conditions:
      - base = vm3-direct-barrier-base-v2-260926
      - title = VM3 DIRECT BARRIER CANDIDATE READY V2 260926
    actions:
      queue:
        name: vm3-direct-barrier-v2-260926

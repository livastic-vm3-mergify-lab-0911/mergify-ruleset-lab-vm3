commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-tmp-260920

scopes:
  source:
    files:
      alpha:
        include:
          - 'alpha/**'
      beta:
        include:
          - 'beta/**'
  barrier_files:
    include:
      - 'global/**'

queue_rules:
  - name: vm3-direct-barrier-260926
    queue_conditions:
      - check-success = vm3-direct-barrier-gate
    merge_conditions:
      - check-success = vm3-direct-barrier-gate
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge

merge_queue:
  mode: serial
  max_parallel_checks: 1

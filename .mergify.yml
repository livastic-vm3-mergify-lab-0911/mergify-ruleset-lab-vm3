commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911
queue_rules:
  - name: signature-mq
    queue_conditions:
      - base != vm3-classic-ruleset-73d0f0
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - base != vm3-classic-ruleset-73d0f0
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge
  - name: classic-ruleset-vm3-classic-ruleset-73d0f0
    queue_conditions:
      - base = vm3-classic-ruleset-73d0f0
    merge_conditions:
      - base = vm3-classic-ruleset-73d0f0
      - label = vm3-merge-hold-73d0f0
    branch_protection_injection_mode: queue
    batch_size: 1
    max_checks_retries: 0
    merge_method: merge
merge_queue:
  mode: serial
  max_parallel_checks: 1
pull_request_rules:
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

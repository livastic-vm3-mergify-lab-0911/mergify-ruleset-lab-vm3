commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911
scopes:
  source:
    files:
      vm3-dm-docs:
        include:
          - vm3-dm-extbase/docs/**
      vm3-dm-core:
        include:
          - vm3-dm-extbase/core/**
queue_rules:
  - name: vm3-sir3-260923
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-pw-backslash-gate-260929
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge

  - name: vm3-freeze-batch-260925
    queue_conditions: []
    merge_conditions: []
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge

  - name: vm3-directmerge-extbase-261004
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-directmerge-extbase-guard
    batch_size: 1
    batch_max_wait_time: 15 seconds
    merge_method: squash
merge_queue:
  skip_intermediate_results: true
  mode: serial
  max_parallel_checks: 2
pull_request_rules:
  - name: vm3 skip-intermediate attacker-code fixture
    conditions:
      - base = vm3-sir3-target-260923
      - title ~= ^VM3 SIR3 260923
    actions:
      queue:
        name: vm3-sir3-260923
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

  - name: vm3 scheduled-freeze exclusion batch 260925
    conditions:
      - base = vm3-freeze-batch-target-260925
      - title ~= ^VM3 FREEZE BATCH 260925
    actions:
      queue:
        name: vm3-freeze-batch-260925

  - name: vm3 directmerge external-base freshness 261004
    conditions:
      - base = vm3-dm-extbase-target-261004
      - title ~= ^VM3 DM EXTBASE 261004
      - check-success = vm3-directmerge-extbase-guard
    actions:
      queue:
        name: vm3-directmerge-extbase-261004

scopes:
  source:
    files:
      all:
        include:
          - "**"

commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911
queue_rules:
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge
  - name: vm3-lastfail-260923
    queue_conditions:
      - base = vm3-lastfail-target-260923
    merge_conditions:
      - check-success = vm3-lastfail-batch-gate
    batch_size: 2
    batch_max_wait_time: 30 seconds
    merge_method: merge

merge_queue:
  mode: parallel
  max_parallel_checks: 2
pull_request_rules:
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

  - name: vm3 last-PR batch failure regression queue
    conditions:
      - base = vm3-lastfail-target-260923
      - title ~= ^VM3 LASTFAIL 260923
    actions:
      queue:
        name: vm3-lastfail-260923

commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911
queue_rules:
  - name: vm3-sir3-260923
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-sir3-gate
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge
merge_queue:
  skip_intermediate_results: true
  mode: serial
  max_parallel_checks: 2
pull_request_rules:
  - name: vm3 skip-intermediate attacker-code fixture
    conditions:
      - base = vm3-sir3-target-260923
      - title ~= ^VM3 SIR3 260923
    actions:
      queue:
        name: vm3-sir3-260923
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

  - name: vm3 stale review-requested permission impact
    conditions:
      - author = livastic-vm3-secondary-20260911
      - base = main
      - title = VM3_REVIEWREQ_STALE_IMPACT_260923
      - review-requested = @vm3-reviewfresh-team-260923
      - check-success = vm3-autogroup-guard
    actions:
      comment:
        message: VM3_REVIEWREQ_STALE_PERMISSION_MATCH
      merge:
        method: merge

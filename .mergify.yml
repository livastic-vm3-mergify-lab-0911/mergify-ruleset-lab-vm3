commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911
queue_rules:
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge
merge_queue:
  mode: serial
  max_parallel_checks: 1
pull_request_rules:
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E
  - name: vm3 copy feature push source fpt7e17
    conditions:
      - author = livastic-vm3-secondary-20260911
      - title = VM3 copy feature push trusted fpt7e17
      - base = main
      - "#files = 1"
      - files = vm3-copy-feature-push-fpt7e17.test.js
    actions:
      copy:
        branches:
          - vm3-copy-target-fpt7e17

  - name: vm3 copy feature push trusted merge fpt7e17
    conditions:
      - author = mergify[bot]
      - base = vm3-copy-target-fpt7e17
      - head ~= ^mergify/copy/vm3-copy-target-fpt7e17/pr-
      - check-success = vm3-copy-push-required-fpt7e17
    actions:
      merge:
        method: merge

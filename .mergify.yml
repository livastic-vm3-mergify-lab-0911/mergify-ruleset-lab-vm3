commands_restrictions:
  queue:
    conditions:
      - sender = mergify[bot]

queue_rules:
  - name: vm3-selfcmd-hold-260927
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-selfcmd-hold-never-260927
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge

pull_request_rules:
  - name: vm3 self-command emitter 260927
    conditions:
      - title = "@Mergifyio queue"
      - body = VM3_SELF_COMMAND_REENTRY_260927
    actions:
      comment:
        message: "{{ title }}"

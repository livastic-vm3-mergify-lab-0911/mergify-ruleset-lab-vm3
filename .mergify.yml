commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: dynamic-membership
    batch_size:
      min: 1
      max: 2
    batch_max_wait_time: 1 second
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-dynamic-hold
    merge_method: squash

merge_queue:
  mode: serial
  max_parallel_checks: 1

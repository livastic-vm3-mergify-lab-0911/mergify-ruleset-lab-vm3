extends: vm3-extends-resolver-order-src-261008-m8q2

scopes:
  source:
    files:
      dm_base:
        include:
          - vm3-dmgen/base/**/*
      dm_victim:
        include:
          - vm3-dmgen/victim/**/*

conflict_resolvers:
  - paths:
      - pnpm-lock.yaml
    strategy: pnpm
  - paths:
      - vm3-json-reorder-policy.json
    strategy: json
  - paths:
      - vm3-extends-order.txt
    strategy: theirs

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
  refresh:
    conditions: true
queue_rules:
  - name: vm3-dmgen-261007
    queue_conditions:
      - base = vm3-dmgen-base-261007
      - title ~= ^VM3 DMGEN 261007
    merge_conditions: []
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: vm3-sir3-260923
    queue_conditions: []
    merge_conditions:
      - check-success = vm3-pw-backslash-gate-260929
    batch_size: 1
    batch_max_wait_time: 30 seconds
    merge_method: merge
  - name: signature-mq
    queue_conditions:
      - check-success = vm3-autogroup-guard
    merge_conditions:
      - check-success = vm3-autogroup-guard
      - check-success = vm3-queue-name-hold-never
    merge_method: merge

  - name: vm3-freeze-batch-260925
    queue_conditions: []
    merge_conditions: []
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge
  - name: vm3-pending-authz-261006
    queue_conditions:
      - base = vm3-pending-authz-target-261006
      - files = ready.txt
    merge_conditions: []
    batch_size: 1
    merge_method: merge

  - name: vm3-pnpm-same-dep-261006
    queue_conditions:
      - base = vm3-pnpm-base-261006
    merge_conditions: []
    batch_size: 1
    merge_method: fast-forward

  - name: vm3-jsonreorder-forcedbatch-261007
    queue_conditions:
      - base = vm3-jsonreorder-base-261007
      - title = VM3 JSON REORDER FORCED 261007
    merge_conditions:
      - check-success = vm3-jsonreorder-never-261007
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch

merge_queue:
  skip_intermediate_results: true
  mode: serial
  max_parallel_checks: 2
pull_request_rules:
  - name: vm3 same suite duplicate check freshness 261009
    conditions:
      - base = vm3-samesuite-base-261009
      - title = VM3 SAMESUITE DUP 261009
      - check-success = @github-actions/vm3-samesuite-dup-261009
    actions:
      comment:
        message: VM3_SAMESUITE_DUP_MATCH_261009
  - name: vm3 required signatures exempt current 261008
    conditions:
      - base = vm3-sig-exempt-base-261008
      - title = VM3 REQUIRED SIGNATURES EXEMPT CURRENT 261008
      - label = vm3-sig-exempt-trigger-261008
    actions:
      merge:
        method: merge
  - name: vm3 edit bot write positive 261007
    conditions:
      - title = VM3 EDIT BOT WRITE POSITIVE 261007
    actions:
      edit:
        draft: true
        bot_account: livastic-vm3-secondary-20260911
  - name: vm3 edit bot post revoke 261007
    conditions:
      - title = VM3 EDIT BOT POST REVOKE 261007
    actions:
      edit:
        draft: true
        bot_account: livastic-vm3-secondary-20260911
  - name: vm3 skip-intermediate attacker-code fixture
    conditions:
      - base = vm3-sir3-target-260923
      - title ~= ^VM3 SIR3 260923
    actions:
      queue:
        name: vm3-sir3-260923
  - name: vm3 queue-name revocation checkrun 9c7e
    conditions:
      - title = VM3 queue-name revocation checkrun 9c7e
      - queue-name = signature-mq
      - check-success = vm3-queue-name-delay-9c7e
    actions:
      comment:
        message: VM3_QUEUE_NAME_STALE_CHECKRUN_9C7E

  - name: vm3 scheduled-freeze exclusion batch 260925
    conditions:
      - base = vm3-freeze-batch-target-260925
      - title ~= ^VM3 FREEZE BATCH 260925
    actions:
      queue:
        name: vm3-freeze-batch-260925

  - name: vm3 CircleCI quarantine impact 261004
    conditions:
      - base = main
      - title = VM3 CIRCLECI QUARANTINE IMPACT 261004
      - author = livastic-vm5-secondary-20260911
      - check-success = vm3-circleci-quarantine-impact-261004
    actions:
      merge:
        method: squash
  - name: vm3 latest checkrun freshness 261008
    conditions:
      - title = VM3 CHECKRUN FRESHNESS 261008
      - check-success = @github-actions/vm3-latest-checkrun-261008
    actions:
      comment:
        message: VM3_CHECKRUN_FRESHNESS_MATCH_261008

commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: auto-a
    autoqueue: true
    queue_conditions:
      - label = vm3-auto-a
    merge_conditions:
      - label = vm3-never-merge
    merge_method: squash

  - name: auto-b
    autoqueue: true
    queue_conditions:
      - label = vm3-auto-b
    merge_conditions:
      - label = vm3-never-merge
    merge_method: squash

  - name: manual-only
    queue_conditions:
      - label = vm3-manual-only
    merge_conditions:
      - label = vm3-never-merge
    merge_method: squash

merge_queue:
  mode: serial
  max_parallel_checks: 1

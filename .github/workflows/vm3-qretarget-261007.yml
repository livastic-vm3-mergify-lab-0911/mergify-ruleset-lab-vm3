name: VM3 quarantine retarget current 261007
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.event.pull_request.title, 'VM3 QRETARGET 261007')
    runs-on: ubuntu-latest
    steps:
      - name: Generate deterministic failing JUnit
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          cat > vm3-qretarget.xml <<'XML'
          <testsuite name="vm3-qretarget-suite" tests="1" failures="1">
            <testcase classname="vm3.qretarget" name="security_gate_261007">
              <failure message="VM3_QRETARGET_FAIL_261007">deterministic failure</failure>
            </testcase>
          </testsuite>
          XML
          cat vm3-qretarget.xml
          exit 1
      - name: Apply Mergify quarantine verdict
        id: mergify-ci
        uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: junit-process
          token: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
          job_name: vm3-qretarget-job-261007
          report_path: vm3-qretarget.xml
          test_step_outcome: ${{ steps.tests.outcome }}

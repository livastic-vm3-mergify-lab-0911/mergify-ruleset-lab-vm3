name: VM3 source-transfer OIDC delay F4A6

on:
  pull_request:

permissions:
  contents: read

jobs:
  delay:
    if: github.event.pull_request.title == 'VM3_XFER_OIDC_IMPACT_F4A6'
    name: vm3-xfer-oidc-delay-f4a6
    runs-on: ubuntu-latest
    steps:
      - name: Hold stale provenance window
        run: |
          echo 'VM3_XFER_OIDC_DELAY_F4A6_STARTED'
          sleep 600
          echo 'VM3_XFER_OIDC_DELAY_F4A6_COMPLETED'

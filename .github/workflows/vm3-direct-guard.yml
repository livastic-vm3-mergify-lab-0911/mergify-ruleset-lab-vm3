name: vm3 Direct Merge guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  guard:
    name: vm3-direct-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject unsafe combined state
        shell: bash
        run: |
          if [[ -f x/trigger.txt && ! -f x/target.txt ]]; then
            echo "unsafe combined x-scope state"
            exit 1
          fi
          echo "safe state"


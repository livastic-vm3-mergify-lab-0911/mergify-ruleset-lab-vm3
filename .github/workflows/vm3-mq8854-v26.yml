name: VM3 MRGFY8854 v26 current
on:
  pull_request:
    branches:
      - vm3-mq8854-v26-base-261007

permissions:
  contents: read

jobs:
  detect-scopes:
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.normalize.outputs.critical }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect scopes with official v26 default CLI
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: scopes
          mergify_config_path: vm3-mq8854-scopes.yml
      - name: Normalize scope result
        id: normalize
        shell: bash
        env:
          RAW_SCOPES: ${{ steps.scopes.outputs.scopes }}
          DETECTED_BASE: ${{ steps.scopes.outputs.base }}
          DETECTED_HEAD: ${{ steps.scopes.outputs.head }}
        run: |
          set -euo pipefail
          echo "VM3_RAW_SCOPES=${RAW_SCOPES:-<empty>}"
          echo "VM3_DETECTED_BASE=${DETECTED_BASE:-<empty>}"
          echo "VM3_DETECTED_HEAD=${DETECTED_HEAD:-<empty>}"
          value=false
          if [ -n "${RAW_SCOPES:-}" ] && jq -e '.["critical"] == "true"' <<<"$RAW_SCOPES" >/dev/null; then value=true; fi
          echo "critical=$value" >> "$GITHUB_OUTPUT"
          echo "VM3_CRITICAL_SCOPE=$value"

  critical-validation:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.critical == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "VM3_CRITICAL_VALIDATION_EXECUTED=yes"
          exit 1

  ci-gate:
    if: ${{ always() }}
    needs: [detect-scopes, critical-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: Mergifyio/gha-mergify-ci@v26
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}

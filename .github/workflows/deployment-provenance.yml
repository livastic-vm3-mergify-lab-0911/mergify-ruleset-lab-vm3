name: VM3 Deployment Provenance
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deployment-gate:
    name: Deployment Provenance Gate
    runs-on: ubuntu-latest
    environment: Mergify Merge Protections
    steps:
      - uses: actions/checkout@v4
      - name: Provenance gate
        run: |
          if [ -f deployment-provenance-fail.txt ]; then
            echo "Intentional GitHub Actions deployment failure"
            exit 1
          fi
          echo "GitHub Actions deployment succeeded"

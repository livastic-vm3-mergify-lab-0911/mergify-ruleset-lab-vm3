name: VM3 AutoRetry external-fork token trust 261004
on:
  pull_request:
permissions:
  contents: write
jobs:
  fork-trust:
    name: vm3-autoretry-fork-trust-261004
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Record trust context and probe base-repo write
        shell: bash
        run: |
          set -u
          echo "VM3_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "VM3_ACTOR=${{ github.actor }}"
          echo "VM3_TRIGGERING_ACTOR=${{ github.triggering_actor }}"
          echo "VM3_EVENT=${{ github.event_name }}"
          echo "VM3_HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "VM3_HEAD_FORK=${{ github.event.pull_request.head.repo.fork }}"
          echo "VM3_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
          git config user.name "vm3-autoretry-probe"
          git config user.email "vm3-autoretry-probe@example.invalid"
          git switch --orphan vm3-autoretry-token-marker-261004
          git rm -rf . >/dev/null 2>&1 || true
          printf 'attempt=%s actor=%s triggering_actor=%s\n' "$GITHUB_RUN_ATTEMPT" "${{ github.actor }}" "${{ github.triggering_actor }}" > VM3_AUTORETRY_TOKEN_MARKER_261004.txt
          git add VM3_AUTORETRY_TOKEN_MARKER_261004.txt
          git commit -m "VM3 AutoRetry token marker attempt $GITHUB_RUN_ATTEMPT"
          if git push origin HEAD:refs/heads/vm3-autoretry-token-marker-261004; then
            echo "VM3_BASE_PUSH=SUCCESS"
          else
            echo "VM3_BASE_PUSH=DENIED"
          fi
      - name: Force first attempt failure
        if: ${{ github.run_attempt == 1 }}
        run: |
          echo VM3_AUTORETRY_FORCE_ATTEMPT1_FAILURE
          exit 1
      - name: Complete rerun
        if: ${{ github.run_attempt != 1 }}
        run: echo VM3_AUTORETRY_RERUN_COMPLETED

name: vm3 draft bot guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  guard:
    name: vm3-draft-bot-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hold synthetic draft
        if: startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
        run: |
          echo "synthetic draft author=${{ github.event.pull_request.user.login }} ref=${{ github.event.pull_request.head.ref }}"
          sleep 120
          exit 1
      - run: echo "candidate guard green"

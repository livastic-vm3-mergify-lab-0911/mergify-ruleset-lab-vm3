name: vm3 base edit guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  guard:
    name: vm3-base-edit-guard
    runs-on: ubuntu-latest
    steps:
      - name: hold synthetic queue PR
        if: startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
        run: sleep 90
      - run: echo "vm3 base edit guard success"


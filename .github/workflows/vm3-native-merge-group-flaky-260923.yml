name: VM3 Native Merge Group Flaky Provenance 260923

on:
  pull_request:
    branches:
      - vm3-native-mg-target-260923
  merge_group:
    types: [checks_requested]
    branches:
      - vm3-native-mg-target-260923

permissions:
  contents: read

jobs:
  vm3-native-merge-group-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Context
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
          echo "REF_NAME=$GITHUB_REF_NAME"
          echo "HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          printf 'A='; cat vm3-native-mg-a.txt
          printf 'B='; cat vm3-native-mg-b.txt
      - name: Gate
        shell: bash
        run: |
          npm install -g npm@10
          WORK="$RUNNER_TEMP/vm3-native-mg-260923"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "$GITHUB_WORKSPACE/vm3-native-mg-a.txt" "$WORK/a.txt"
          cp "$GITHUB_WORKSPACE/vm3-native-mg-b.txt" "$WORK/b.txt"
          cd "$WORK"
          cat > package.json <<'PKG'
          {"private":true,"type":"module"}
          PKG
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > gate.test.js <<'TEST'
          import { readFileSync } from 'node:fs';
          import { test, expect } from 'vitest';
          test('VM3_ISSUE_COMMENT_GATE_icfded17', () => {
            const a = readFileSync('a.txt', 'utf8').trim();
            const b = readFileSync('b.txt', 'utf8').trim();
            expect(`${a}:${b}`).not.toBe('1:1');
          });
          TEST
          cat > vitest.config.mjs <<'CFG'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          CFG
          npx vitest run gate.test.js --config vitest.config.mjs

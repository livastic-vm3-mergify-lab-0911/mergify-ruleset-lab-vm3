name: VM3 main-only environment canary proof

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main-only-environment-proof:
    runs-on: ubuntu-latest
    environment: vm3-rspec-main-only-7f31
    steps:
      - name: Verify protected-main environment canary is available
        env:
          VM3_RSPEC_ENV_CANARY: ${{ secrets.VM3_RSPEC_ENV_CANARY }}
        shell: bash
        run: |
          if [ -n "$VM3_RSPEC_ENV_CANARY" ]; then
            echo "VM3_MAIN_ONLY_ENV_CANARY_PRESENT_7F31"
            exit 0
          fi
          echo "VM3_MAIN_ONLY_ENV_CANARY_MISSING"
          exit 1


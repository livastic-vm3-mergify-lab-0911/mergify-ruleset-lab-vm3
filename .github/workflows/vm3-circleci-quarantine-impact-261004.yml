name: VM3 CircleCI quarantine impact 261004
on:
  workflow_run:
    workflows: ["vm3 strict required-check guard"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  circleci-impact:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'vm3-sir3-target-260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
      VM3_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      VM3_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Setup released Mergify CLI
        uses: Mergifyio/setup-cli@v1.3.0
        with:
          mergify_cli_version: 2026.9.10.1

      - name: Record trusted coordinates
        run: |
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          echo "HEAD_SHA=$VM3_HEAD_SHA"
          echo "HEAD_BRANCH=$VM3_HEAD_BRANCH"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          mergify --version

      - name: Generate deterministic failing JUnit
        run: |
          cat > /tmp/vm3-circleci-quarantine.xml <<'XML'
          <testsuite name="vm3-circleci-quarantine" tests="1" failures="1">
            <testcase name="tests/dir/gate.spec.js &gt; security gate">
              <failure message="VM3_CIRCLECI_QUARANTINE_FAIL_261004">VM3_CIRCLECI_QUARANTINE_FAIL_261004</failure>
            </testcase>
          </testsuite>
          XML
          cat /tmp/vm3-circleci-quarantine.xml

      - name: Control explicit target main must fail
        id: control
        shell: bash
        run: |
          set +e
          env -u GITHUB_ACTIONS             CIRCLECI=true             CIRCLE_BRANCH="$VM3_HEAD_BRANCH"             CIRCLE_SHA1="$VM3_HEAD_SHA"             CIRCLE_REPOSITORY_URL="https://github.com/$GITHUB_REPOSITORY.git"             CIRCLE_JOB="vm3-circleci-quarantine-impact"             MERGIFY_TOKEN="$MERGIFY_TOKEN"             mergify ci junit-process --color never --repository "$GITHUB_REPOSITORY" --tests-target-branch main /tmp/vm3-circleci-quarantine.xml
          rc=$?
          set -e
          echo "CONTROL_EXIT=$rc"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 1

      - name: Treatment CircleCI auto target must false-green
        id: treatment
        shell: bash
        run: |
          set +e
          env -u GITHUB_ACTIONS             CIRCLECI=true             CIRCLE_BRANCH="$VM3_HEAD_BRANCH"             CIRCLE_SHA1="$VM3_HEAD_SHA"             CIRCLE_REPOSITORY_URL="https://github.com/$GITHUB_REPOSITORY.git"             CIRCLE_JOB="vm3-circleci-quarantine-impact"             MERGIFY_TOKEN="$MERGIFY_TOKEN"             mergify ci junit-process --color never --repository "$GITHUB_REPOSITORY" /tmp/vm3-circleci-quarantine.xml
          rc=$?
          set -e
          echo "TREATMENT_EXIT=$rc"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0

      - name: Publish trusted success status only after differential
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             "repos/$GITHUB_REPOSITORY/statuses/$VM3_HEAD_SHA"             -f state=success             -f context=vm3-circleci-quarantine-impact-261004             -f description='CircleCI target-branch differential reproduced'

name: VM3 cross-job unhealthy identity AB 261005
on:
  push:
    branches:
      - vm3-crossjob-health-ab-261005
permissions:
  contents: read

jobs:
  crossjob-victim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install released consumer
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-health-261005"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.11 @mergifyio/vitest@0.4.3

      - name: Same-body clean-name versus cross-job unhealthy-name
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-health-261005"
          cd "$WORK"

          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          JS

          cat > control.test.js <<'JS'
          import { it, expect } from 'vitest';
          it('vm3.crossjob.control.261005.q7k9', () => {
            expect('SAFE').toBe('BROKEN');
          });
          JS

          cat > treatment.test.js <<'JS'
          import { it, expect } from 'vitest';
          it('VM3_ISSUE_COMMENT_GATE_icfded17', () => {
            expect('SAFE').toBe('BROKEN');
          });
          JS

          set +e
          npx vitest run control.test.js --config vitest.config.mjs 2>&1 | tee control.log
          control_rc=${PIPESTATUS[0]}
          npx vitest run treatment.test.js --config vitest.config.mjs 2>&1 | tee treatment.log
          treatment_rc=${PIPESTATUS[0]}
          set -e

          echo "VM3_PIPELINE=$GITHUB_WORKFLOW"
          echo "VM3_JOB=$GITHUB_JOB"
          echo "VM3_SHA=$GITHUB_SHA"
          echo "VM3_EVENT=$GITHUB_EVENT_NAME"
          echo "VM3_REF=$GITHUB_REF"
          echo "VM3_BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          echo "VM3_HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "CONTROL_RC=$control_rc"
          echo "TREATMENT_RC=$treatment_rc"
          echo "=== CONTROL MERGIFY LINES ==="
          grep -E 'Mergify|Flaky detection|mode:|Tests rerun|Test Files|Tests ' control.log || true
          echo "=== TREATMENT MERGIFY LINES ==="
          grep -E 'Mergify|Flaky detection|mode:|Tests rerun|Test Files|Tests ' treatment.log || true

          test "$control_rc" -eq 1
          test "$treatment_rc" -eq 0

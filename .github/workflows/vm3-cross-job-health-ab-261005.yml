name: VM3 cross-job unhealthy identity AB 261005
on:
  push:
    branches:
      - vm3-crossjob-health-ab-261005

jobs:
  control-victim:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install released consumer
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-control-261005"
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.11 @mergifyio/vitest@0.4.3
      - name: Deterministic clean-name control
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-control-261005"
          cd "$WORK"
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          JS
          cat > test.js <<'JS'
          import { it, expect } from 'vitest';
          it('vm3.crossjob.control.261005.q7k9', () => {
            expect('SAFE').toBe('BROKEN');
          });
          JS
          echo "VM3_PIPELINE=$GITHUB_WORKFLOW"
          echo "VM3_JOB=$GITHUB_JOB"
          echo "VM3_EVENT=$GITHUB_EVENT_NAME"
          npx vitest run test.js --config vitest.config.mjs
      - name: Control write canary must stay unreachable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/heads/vm3-crossjob-health-control-write-261005' \
            -f sha="$GITHUB_SHA"

  treatment-victim:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install released consumer
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-treatment-261005"
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.11 @mergifyio/vitest@0.4.3
      - name: Deterministic cross-job unhealthy treatment
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-crossjob-treatment-261005"
          cd "$WORK"
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          JS
          cat > test.js <<'JS'
          import { it, expect } from 'vitest';
          it('VM3_ISSUE_COMMENT_GATE_icfded17', () => {
            expect('SAFE').toBe('BROKEN');
          });
          JS
          echo "VM3_PIPELINE=$GITHUB_WORKFLOW"
          echo "VM3_JOB=$GITHUB_JOB"
          echo "VM3_EVENT=$GITHUB_EVENT_NAME"
          npx vitest run test.js --config vitest.config.mjs
      - name: Treatment-only base repository write canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/heads/vm3-crossjob-health-write-261005' \
            -f sha="$GITHUB_SHA" \
            --jq '{ref,sha:.object.sha}'

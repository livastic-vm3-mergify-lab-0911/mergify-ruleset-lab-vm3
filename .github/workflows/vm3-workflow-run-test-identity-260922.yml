name: VM3 workflow_run Test Insights identity 260922
on:
  workflow_run:
    workflows: ["vm3 strict required-check guard"]
    types: [completed]
permissions:
  contents: read
jobs:
  test-insights:
    if: startsWith(github.event.workflow_run.head_branch, 'vm3-wfr-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record trusted workflow_run coordinates
        env:
          WFR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WFR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WFR_EVENT: ${{ github.event.workflow_run.event }}
          WFR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WFR_PRS: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "WFR_HEAD_SHA=$WFR_HEAD_SHA"
          echo "WFR_HEAD_BRANCH=$WFR_HEAD_BRANCH"
          echo "WFR_EVENT=$WFR_EVENT"
          echo "WFR_CONCLUSION=$WFR_CONCLUSION"
          echo "WFR_PRS=$WFR_PRS"
      - name: Generate controlled JUnit report
        env:
          WFR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TEST_NAME="same_test"
          if [[ "$WFR_HEAD_BRANCH" == *"autoq"* ]]; then
            TEST_NAME="autoq_test"
          fi
          if [[ "$WFR_HEAD_BRANCH" == *"selfpoison"* ]]; then
            TEST_NAME="selfpoison_health_260927_h9k3"
          fi
          if [[ "$WFR_HEAD_BRANCH" == *"fail"* ]]; then
            cat > vm3-wfr-collision.xml <<XML
          <testsuite name="vm3-wfr-collision-suite" tests="1" failures="1">
            <testcase classname="vm3.wfr" name="$TEST_NAME"><failure message="controlled failure">controlled failure</failure></testcase>
          </testsuite>
          XML
          else
            cat > vm3-wfr-collision.xml <<XML
          <testsuite name="vm3-wfr-collision-suite" tests="1" failures="0">
            <testcase classname="vm3.wfr" name="$TEST_NAME"/>
          </testsuite>
          XML
          fi
          cat vm3-wfr-collision.xml
      - name: Upload controlled JUnit to Mergify
        id: mergify-ci
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
          job_name: vm3-workflow-run-collision-job-260922
          report_path: vm3-wfr-collision.xml
      - name: Upload status
        if: always()
        env:
          UPLOAD: ${{ steps.mergify-ci.outputs.test_results_upload }}
        run: echo "MERGIFY_UPLOAD=$UPLOAD"

  vitest-selfpoison:
    if: contains(github.event.workflow_run.head_branch, 'selfpoison-vitest')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_ISSUE_COMMENT_MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record Vitest workflow_run coordinates
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "SHA=$GITHUB_SHA"
          echo "REF_NAME=$GITHUB_REF_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          echo "HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "TRIGGER_HEAD=${{ github.event.workflow_run.head_sha }}"
          echo "TRIGGER_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
      - name: Run deterministic Vitest self-poison identity
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/vm3-wfr-selfpoison-vitest-h9k3"
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > vitest.config.mjs <<'JS'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          JS
          cat > vm3-wfr-selfpoison-vitest-h9k3.test.js <<'JS'
          import { describe, it, expect } from 'vitest';
          describe('vm3-wfr-selfpoison-vitest-h9k3',()=>{
            it('deterministic-poison',()=>{ expect('SAFE').toBe('BROKEN'); });
          });
          JS
          npx vitest run vm3-wfr-selfpoison-vitest-h9k3.test.js --config vitest.config.mjs
      - name: Vitest post-test sentinel
        run: echo "VITEST_SELF_POISON_SENTINEL_EXECUTED trigger=${{ github.event.workflow_run.head_sha }}"

name: vm3 feature push proof l8d4
on:
  push:
    branches: [feature-push-proof-l8d4]
  pull_request:
    branches: [vm3-feature-push-base-l8d4]
permissions:
  contents: read
jobs:
  vm3-push-required:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Event identity
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF-}"
          echo "HEAD_REF=${GITHUB_HEAD_REF-}"
          echo "REF=$GITHUB_REF"
          echo "REF_NAME=$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
      - name: Run deterministic required test
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          VM3_FORCE_FAIL: '1'
        run: |
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          cat > feature-push.test.js <<'EOF'
          import { it, expect } from 'vitest';
          it('VM3.chunk.completeness.fail.20260915.a7f9', () => {
            expect(process.env.VM3_FORCE_FAIL === '1').toBe(false);
          });
          EOF
          npx vitest run feature-push.test.js --config vitest.config.mjs
  vm3-pr-control:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TEST_JOB_NAME: vm3-push-required
    steps:
      - name: Event identity
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF-}"
          echo "HEAD_REF=${GITHUB_HEAD_REF-}"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
      - name: Run deterministic PR control
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          VM3_FORCE_FAIL: '1'
        run: |
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          cat > feature-push.test.js <<'EOF'
          import { it, expect } from 'vitest';
          it('VM3.chunk.completeness.fail.20260915.a7f9', () => {
            expect(process.env.VM3_FORCE_FAIL === '1').toBe(false);
          });
          EOF
          npx vitest run feature-push.test.js --config vitest.config.mjs

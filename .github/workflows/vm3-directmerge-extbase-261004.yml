name: VM3 Direct Merge external-base freshness 261004

on:
  pull_request:
    branches:
      - vm3-dm-extbase-target-261004
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  guard:
    name: vm3-directmerge-extbase-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deterministic merged-state discriminator
        shell: bash
        run: |
          set -euo pipefail
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "PR=${{ github.event.pull_request.number }}"
          echo "HEAD=${{ github.event.pull_request.head.sha }}"
          echo "BASE=${{ github.event.pull_request.base.sha }}"
          if [ ! -f vm3-dm-extbase/phase-treatment.txt ]; then
            if [ -f vm3-dm-extbase/core/control-base.txt ] && [ -f vm3-dm-extbase/docs/control-candidate.txt ]; then
              echo "VM3_DM_CONTROL_COMBINED_FAIL=true"
              exit 1
            fi
          fi
          if [ -f vm3-dm-extbase/phase-treatment.txt ]; then
            if [ -f vm3-dm-extbase/core/treatment-base.txt ] && [ -f vm3-dm-extbase/docs/treatment-candidate.txt ]; then
              echo "VM3_DM_TREATMENT_COMBINED_FAIL=true"
              exit 1
            fi
          fi
          echo "VM3_DM_GUARD=pass"

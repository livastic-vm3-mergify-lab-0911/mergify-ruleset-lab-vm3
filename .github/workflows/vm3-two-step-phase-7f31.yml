name: VM3 two-step phase provenance

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  preliminary:
    name: vm3-two-step-preliminary-7f31
    runs-on: ubuntu-latest
    steps:
      - name: preliminary always succeeds
        run: echo "preliminary success for ${{ github.head_ref }}"

  premerge:
    name: vm3-two-step-premerge-7f31
    runs-on: ubuntu-latest
    steps:
      - name: discriminate original PR from Mergify queue branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          echo "HEAD_REF=$HEAD_REF"
          if [[ "$HEAD_REF" == mergify/merge-queue/* ]]; then
            echo "intentional queue-phase failure"
            exit 1
          fi
          echo "intentional original-PR success"

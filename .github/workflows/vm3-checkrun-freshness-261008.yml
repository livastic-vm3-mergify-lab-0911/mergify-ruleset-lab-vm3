name: VM3 checkrun same-suite duplicate name 261009
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  earlier_success:
    name: vm3-latest-checkrun-261008
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo VM3_SAME_SUITE_EARLIER_SUCCESS_261009
          exit 0

  later_failure:
    name: vm3-latest-checkrun-261008
    needs: earlier_success
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo VM3_SAME_SUITE_LATER_FAILURE_261009
          exit 1

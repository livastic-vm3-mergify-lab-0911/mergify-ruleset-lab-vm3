name: VM3 checkrun freshness 261008
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  earlier-success:
    name: vm3-latest-checkrun-261008
    runs-on: ubuntu-latest
    steps:
      - name: Earlier success
        run: |
          echo "VM3_SAME_SUITE_EARLIER_SUCCESS=1"
          exit 0

  later-failure:
    name: vm3-latest-checkrun-261008
    needs: earlier-success
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Later failure
        run: |
          echo "VM3_SAME_SUITE_LATER_FAILURE=1"
          exit 1

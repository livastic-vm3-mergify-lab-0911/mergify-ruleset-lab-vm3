name: vm3 q9c2 flaky-context diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query context safely
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          set -euo pipefail
          url='https://api.mergify.com/v1/ci/livastic-vm3-mergify-lab-0911/repositories/mergify-ruleset-lab-vm3/flaky-detection-context'
          code=$(curl -sS -o context.json -w '%{http_code}' -H "Authorization: Bearer $MERGIFY_TOKEN" -H 'Accept: application/json' "$url")
          echo "CONTEXT_HTTP=$code"
          if [ "$code" = 200 ]; then
            jq -r '"EXISTING_COUNT="+((.existing_test_names|length)|tostring)' context.json
            jq -r '"UNHEALTHY_COUNT="+((.unhealthy_test_names|length)|tostring)' context.json
            jq -r '"TARGET_EXISTING="+([.existing_test_names[]|select(.=="VM3.chunk.completeness.fail.20260915.a7f9")]|length>0|tostring)' context.json
            jq -r '"TARGET_UNHEALTHY="+([.unhealthy_test_names[]|select(.=="VM3.chunk.completeness.fail.20260915.a7f9")]|length>0|tostring)' context.json
            jq -r '"NEW_BUDGET="+(.budget_ratio_for_new_tests|tostring)' context.json
            jq -r '"UNHEALTHY_BUDGET="+(.budget_ratio_for_unhealthy_tests|tostring)' context.json
          fi
          rm -f context.json

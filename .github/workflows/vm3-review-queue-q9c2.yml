name: vm3-chunk-completeness-pipeline-a7f9
on:
  pull_request:
    branches: [vm3-review-queue-base-q9c2]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  vm3-pr-control:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TEST_JOB_NAME: vm3-chunk-completeness-job-a7f9
    steps:
      - name: Event identity
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF-}"
          echo "HEAD_REF=${GITHUB_HEAD_REF-}"
          if [ -n "$MERGIFY_TOKEN" ]; then echo TOKEN_PRESENT=yes; else echo TOKEN_PRESENT=no; fi
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run isolated deterministic control
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          VM3_FORCE_FAIL: '1'
        run: |
          d="$RUNNER_TEMP/vm3-q9c2"
          rm -rf "$d" && mkdir -p "$d" && cd "$d"
          npm init -y >/dev/null 2>&1
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          cat > q9c2.test.js <<'EOF'
          import { it, expect } from 'vitest';
          it('VM3.chunk.completeness.fail.20260915.a7f9', () => { expect(process.env.VM3_FORCE_FAIL === '1').toBe(false); });
          EOF
          npx vitest run q9c2.test.js --config vitest.config.mjs
  vm3-review-queue-required:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    env:
      MERGIFY_TEST_JOB_NAME: vm3-chunk-completeness-job-a7f9
    steps:
      - name: Event identity
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF-}"
          echo "HEAD_REF=${GITHUB_HEAD_REF-}"
          echo "REF=$GITHUB_REF"
          echo "SHA=$GITHUB_SHA"
          if [ -n "$MERGIFY_TOKEN" ]; then echo TOKEN_PRESENT=yes; else echo TOKEN_PRESENT=no; fi
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run isolated deterministic required test
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          VM3_FORCE_FAIL: '1'
        run: |
          d="$RUNNER_TEMP/vm3-q9c2"
          rm -rf "$d" && mkdir -p "$d" && cd "$d"
          npm init -y >/dev/null 2>&1
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          cat > q9c2.test.js <<'EOF'
          import { it, expect } from 'vitest';
          it('VM3.chunk.completeness.fail.20260915.a7f9', () => { expect(process.env.VM3_FORCE_FAIL === '1').toBe(false); });
          EOF
          npx vitest run q9c2.test.js --config vitest.config.mjs

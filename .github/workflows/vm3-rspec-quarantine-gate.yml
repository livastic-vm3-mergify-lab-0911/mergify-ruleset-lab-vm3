name: VM3 RSpec quarantine protected merge proof

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rspec-quarantine-gate:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install rspec -v '~> 3.13' --no-document
      - run: gem install rspec-mergify -v '0.2.0' --no-document
      - name: Run required RSpec gate
        run: rspec --require rspec_mergify spec/gate_spec.rb --format documentation

name: VM3 CI Trace Path Payload Binding
on:
  workflow_dispatch:
    inputs:
      case:
        description: test selector
        required: true
        type: choice
        options:
          - matched
          - mismatch
      payload_repository:
        description: OTLP vcs.repository.name value
        required: true
        type: string
permissions:
  contents: read
jobs:
  trace-bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERGIFY_TOKEN: ${{ secrets.VM3_TRACEBIND_TOKEN }}
      MERGIFY_TEST_JOB_NAME: vm3-tracebind-9e521d
      VM3_PAYLOAD_REPOSITORY: ${{ inputs.payload_repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show toolchain
        run: |
          python --version
          rustc --version
          cargo --version
      - name: Install current upstream pytest-mergify
        run: pip install 'git+https://github.com/Mergifyio/mergify-ci-integrations.git@eb58dda97e10ca3151c2ef6e0106bf5e692606cd#subdirectory=clients/pytest-mergify'
      - name: Run controlled failing test
        run: pytest -q -s "vm3-tracebind-9e521d/test_probe.py" -k "${{ inputs.case }}_9e521d"
